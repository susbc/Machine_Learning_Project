# =============================================================================
# GitHub Actions - 测试工作流
# 运行单元测试并生成覆盖率报告
# =============================================================================

name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # NumPy 2.4、SciPy 1.17 和 scikit-learn 1.8 均要求 Python >= 3.11。
        python-version: ["3.11", "3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 安装测试依赖
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests with coverage
        # 主测试任务：pytest.ini 的 norecursedirs 已排除 tests/knowledge，
        # knowledge 测试由下方独立的 test-knowledge 任务运行
        # （sentence-transformers 会加载 torch，与 lightgbm/xgboost 原生库同进程会段错误）
        run: |
          pytest tests/ \
            --cov=model_code \
            --cov=web_app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -v \
            --tb=short
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
      
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7
      
      - name: Check coverage threshold
        run: |
          # 当前完整测试基线约 21%，先强制守住 20%，后续随补测逐步提高。
          coverage report --fail-under=20

  test-knowledge:
    # =========================================================================
    # 独立任务：knowledge 测试（tests/knowledge）
    # 必须与主测试分开进程运行：导入 sentence-transformers 会加载 torch，
    # 与 lightgbm/xgboost 的原生库同进程会触发段错误（本地已复现）。
    # 该任务需要 Neo4j 服务（由下方 service 容器提供）。
    # =========================================================================
    name: Run Knowledge Tests (separate task)
    runs-on: ubuntu-latest
    continue-on-error: true   # 已知存量失败：test_semantic_similarity 用英文模型断言中文语义；HF 模型反复加载可能触发限流
    services:
      neo4j:
        image: neo4j:5
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/test123
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run knowledge tests
        # 显式指定 tests/knowledge 时 norecursedirs 不影响收集（已本地验证）
        env:
          TEST_NEO4J_URI: bolt://localhost:7687
          TEST_NEO4J_USER: neo4j
          TEST_NEO4J_PASSWORD: test123
        run: |
          pytest tests/knowledge \
            --cov=core \
            --cov-report=term-missing \
            -v \
            --tb=short
